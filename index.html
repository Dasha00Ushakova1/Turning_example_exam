<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>Turning shop123456789101112</h1>
        <nav>
            <ul>
                <li><a href="#catalog">Каталог</a></li>
                <li><a href="#orders">Заказы</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="catalog">
            <h2>Каталог</h2>
            <table id="catalog-table">
                <thead>
                    <tr>
                        <th>Код товара</th>
                        <th>Название товара</th>
                        <th>Цена</th>
                        <th>Количество</th>
                    </tr>
                </thead>
                <tbody id="catalog-body"></tbody>
            </table>
        </section>
        <section id="orders">
            <h2>Заказы</h2>
            <table>
                <thead>
                    <tr>
                        <th>Код заказа</th>
                        <th>Код клиента</th>
                        <th>Дата заказа</th>
                        <th>Общая стоимость</th>
                    </tr>
                </thead>
                <tbody id="orders-body"></tbody>
            </table>
        </section>
    </main>
    <script>
        // Получаем данные из таблицы через API-запрос
        function getCatalog() {
            fetch('/api/products')
                .then(response => response.json())
                .then(data => {
                    const catalogBody = document.getElementById('catalog-body');
                    data.forEach((row) => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${row.Product_Code}</td>
                            <td>${row.Product_Name}</td>
                            <td>${row.Price}</td>
                            <td>${row.Quantity}</td>
                        `;
                        catalogBody.appendChild(tr);
                    });
                })
                .catch(error => console.error(error));
        }

        function getOrders() {
            fetch('/api/orders')
                .then(response => response.json())
                .then(data => {
                    const ordersBody = document.getElementById('orders-body');
                    data.forEach((row) => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${row.Order_Code}</td>
                            <td>${row.Customer_Code}</td>
                            <td>${row.Order_Date}</td>
                            <td>${row.Total_Cost}</td>
                        `;
                        ordersBody.appendChild(tr);
                    });
                })
                .catch(error => console.error(error));
        }

        getCatalog();
        getOrders();
    </script>
</body>
</html>
