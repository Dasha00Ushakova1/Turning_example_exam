<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>Turning shop1234567891011</h1>
        <nav>
            <ul>
                <li><a href="#catalog">Каталог</a></li>
                <li><a href="#orders">Заказы</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="catalog">
            <h2>Каталог</h2>
            <table id="catalog-table">
                <thead>
                    <tr>
                        <th>Код товара</th>
                        <th>Название товара</th>
                        <th>Цена</th>
                        <th>Количество</th>
                    </tr>
                </thead>
                <tbody id="catalog-body"></tbody>
            </table>
        </section>
        <section id="orders">
            <h2>Заказы</h2>
            <table>
                <thead>
                    <tr>
                        <th>Код заказа</th>
                        <th>Код клиента</th>
                        <th>Дата заказа</th>
                        <th>Общая стоимость</th>
                    </tr>
                </thead>
                <tbody id="orders-body"></tbody>
            </table>
        </section>
    </main>
    <script>
        var db = indexedDB.open('mydb', 1);
        db.onupgradeneeded = function(e) {
            var store = db.transaction('mytable', 'readwrite').objectStore('mytable');
            store.createIndex('key', 'key', { unique: true });
        };

        function getCatalog() {
            var transaction = db.transaction('mytable', 'readonly');
            var store = transaction.objectStore('mytable');
            var request = store.getAll();
            request.onsuccess = function(e) {
                var rows = request.result;
                var catalogBody = document.getElementById('catalog-body');
                rows.forEach((row) => {
                    var tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.key}</td>
                        <td>${row.value.Product_Name}</td>
                        <td>${row.value.Price}</td>
                        <td>${row.value.Quantity}</td>
                    `;
                    catalogBody.appendChild(tr);
                });
            };
        }

        function getOrders() {
            var transaction = db.transaction('mytable', 'readonly');
            var store = transaction.objectStore('mytable');
            var request = store.getAll();
            request.onsuccess = function(e) {
                var rows = request.result;
                var ordersBody = document.getElementById('orders-body');
                rows.forEach((row) => {
                    var tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.key}</td>
                        <td>${row.value.Customer_Code}</td>
                        <td>${row.value.Order_Date}</td>
                        <td>${row.value.Total_Cost}</td>
                    `;
                    ordersBody.appendChild(tr);
                });
            };
        }

        db.onsuccess = function(e) {
            getCatalog();
            getOrders();
        };

        db.onerror = function(e) {
            console.error(e);
        };
    </script>
</body>
</html>
