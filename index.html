<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Просмотр базы данных</title>
    <!-- Подключаем sql.js -->
    <script src="sql-wasm.js"></script>
</head>
<body>
    <h1>Данные из db.db</h1>
    <div id="output">Загрузка...</div>

    <script>
        // Функция для отображения таблицы
        function renderTable(data) {
            if (!data || data.length === 0) {
                document.getElementById('output').innerText = 'Нет данных';
                return;
            }
            const result = data[0]; // Берем результат первого запроса
            const columns = result.columns;
            const values = result.values;

            let html = '<table border="1"><thead><tr>';
            columns.forEach(col => html += `<th>${col}</th>`);
            html += '</tr></thead><tbody>';
            
            values.forEach(row => {
                html += '<tr>';
                row.forEach(cell => html += `<td>${cell}</td>`);
                html += '</tr>';
            });
            html += '</tbody></table>';
            document.getElementById('output').innerHTML = html;
        }

        // Основная логика
        async function init() {
            // 1. Инициализируем библиотеку
            const SQL = await initSqlJs({
                // Указываем, где искать wasm-файл
                locateFile: file => `./${file}` 
            });

            // 2. Скачиваем файл базы данных
            try {
                const response = await fetch('./db.db');
                if (!response.ok) throw new Error('Файл db.db не найден');
                const buffer = await response.arrayBuffer();
                
                // 3. Создаем базу данных в памяти из скачанного файла
                const db = new SQL.Database(new Uint8Array(buffer));

                // 4. Выполняем запрос (замените my_table на имя вашей таблицы)
                const result = db.exec("SELECT * FROM my_table LIMIT 50");
                
                // 5. Показываем на странице
                renderTable(result);

            } catch (err) {
                document.getElementById('output').innerText = 'Ошибка: ' + err.message;
            }
        }

        // Запускаем все это
        init();
    </script>
</body>
</html>
